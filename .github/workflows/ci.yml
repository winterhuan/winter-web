name: CI & Deploy

# PR 和 push 都跑测试+构建；push 到 main 且配置了 Cloudflare 凭据时自动部署
# 需要在仓库 Settings → Secrets and variables → Actions 添加：
#   CLOUDFLARE_API_TOKEN —— 权限模板「Edit Cloudflare Workers」，包含 Pages Write
# 部署目标项目名：winter-web（https://winter-web.pages.dev）
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # 不用 wrangler-action：它会复用仓库的 pnpm 环境安装 wrangler，
      # workerd 的构建脚本会被 pnpm 11 拦截导致 install 失败；npx 走独立环境无此问题
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@latest pages deploy dist --project-name=winter-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
